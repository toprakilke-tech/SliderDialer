name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip ac
        run: |
          mkdir proje
          unzip -q SliderDialer-1.zip -d proje
          ls -R proje | head -50

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Debug APK uret
        run: |
          cd "$(dirname "$(find proje -name 'settings.gradle*' | head -1)")"
          gradle assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: proje/**/*-debug.apk
